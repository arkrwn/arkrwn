<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="210" viewBox="0 0 1200 210" role="img" aria-label="GitHub stats">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1020"/>
      <stop offset="55%" stop-color="#131A33"/>
      <stop offset="100%" stop-color="#0E2430"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5B8CFF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#38E1C6" stop-opacity="0.35"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="210" rx="24" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="208" rx="23" fill="none" stroke="url(#edge)"/>
  <g>
    <text x="48" y="82" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12"
          font-weight="700" letter-spacing="1.6" fill="#7E93B5">TOTAL CONTRIBUTIONS</text>
    <text x="48" y="136" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="46"
          font-weight="800" fill="#EAF1FF">388</text>
    <text x="48" y="162" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12"
          fill="#6F87AC">since 2016</text>
  </g>
  <g>
    <text x="330" y="82" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12"
          font-weight="700" letter-spacing="1.6" fill="#7E93B5">LAST 12 MONTHS</text>
    <text x="330" y="136" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="46"
          font-weight="800" fill="#A9C4FF">137</text>
    <text x="330" y="162" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12"
          fill="#6F87AC">rolling year</text>
  </g>
  <g>
    <text x="586" y="82" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12"
          font-weight="700" letter-spacing="1.6" fill="#7E93B5">LONGEST STREAK</text>
    <text x="586" y="136" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="46"
          font-weight="800" fill="#38E1C6">4 d</text>
    <text x="586" y="162" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12"
          fill="#6F87AC">consecutive days</text>
  </g>
  <g>
    <text x="842" y="82" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12"
          font-weight="700" letter-spacing="1.6" fill="#7E93B5">CURRENT STREAK</text>
    <text x="842" y="136" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="46"
          font-weight="800" fill="#6FE7D2">4 d</text>
    <text x="842" y="162" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12"
          fill="#6F87AC">as of today</text>
  </g>
  <g>
    <text x="48" y="190" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11"
          fill="#5C708F">public repos: 11 · updated 2026-11-10 · generated from the GitHub API</text>
  </g>
