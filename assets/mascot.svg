<svg xmlns="http://www.w3.org/2000/svg" width="420" height="420" viewBox="0 0 420 420" role="img" aria-label="Cute cat coding">
  <defs>
    <linearGradient id="bgm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF3F8"/>
      <stop offset="100%" stop-color="#EFEAFF"/>
    </linearGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F6EEFF"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2B2140"/>
      <stop offset="100%" stop-color="#3B2F57"/>
    </linearGradient>
  </defs>

  <rect width="420" height="420" rx="40" fill="url(#bgm)"/>
  <circle cx="80" cy="70" r="46" fill="#FFD6E7" opacity="0.55"/>
  <circle cx="350" cy="330" r="64" fill="#C9B6FF" opacity="0.35"/>

  <!-- sparkles -->
  <g fill="#FFB7D5">
    <path d="M330 62 l5 12 12 5 -12 5 -5 12 -5 -12 -12 -5 12 -5z"/>
    <path d="M70 300 l4 9 9 4 -9 4 -4 9 -4 -9 -9 -4 9 -4z"/>
  </g>
  <g fill="#7CD9C9">
    <path d="M356 190 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3z"/>
  </g>

  <!-- ears -->
  <path d="M132 150 L118 96 L172 126 Z" fill="url(#fur)" stroke="#E3D6F5" stroke-width="4" stroke-linejoin="round"/>
  <path d="M288 150 L302 96 L248 126 Z" fill="url(#fur)" stroke="#E3D6F5" stroke-width="4" stroke-linejoin="round"/>
  <path d="M136 140 L128 110 L160 128 Z" fill="#FFC2DA"/>
  <path d="M284 140 L292 110 L260 128 Z" fill="#FFC2DA"/>

  <!-- head -->
  <ellipse cx="210" cy="185" rx="100" ry="88" fill="url(#fur)" stroke="#E3D6F5" stroke-width="4"/>

  <!-- eyes -->
  <ellipse cx="176" cy="180" rx="13" ry="16" fill="#3B2F57"/>
  <ellipse cx="244" cy="180" rx="13" ry="16" fill="#3B2F57"/>
  <circle cx="180" cy="174" r="4.5" fill="#FFFFFF"/>
  <circle cx="248" cy="174" r="4.5" fill="#FFFFFF"/>

  <!-- blush -->
  <ellipse cx="150" cy="205" rx="15" ry="9" fill="#FFB7D5" opacity="0.75"/>
  <ellipse cx="270" cy="205" rx="15" ry="9" fill="#FFB7D5" opacity="0.75"/>

  <!-- nose + mouth -->
  <path d="M204 200 l6 6 6 -6z" fill="#F08CAE"/>
  <path d="M198 212 q12 10 24 0" stroke="#B9A7D6" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- whiskers -->
  <g stroke="#D9C9EE" stroke-width="3.5" stroke-linecap="round">
    <path d="M112 186 l-28 -6"/><path d="M112 200 l-30 4"/>
    <path d="M308 186 l28 -6"/><path d="M308 200 l30 4"/>
  </g>

  <!-- body -->
  <path d="M128 268 q82 -34 164 0 q16 40 -12 68 q-70 26 -140 0 q-28 -28 -12 -68z" fill="url(#fur)" stroke="#E3D6F5" stroke-width="4"/>

  <!-- laptop -->
  <g>
    <rect x="118" y="292" width="184" height="96" rx="12" fill="#FFFFFF" stroke="#E3D6F5" stroke-width="4"/>
    <rect x="132" y="304" width="156" height="64" rx="8" fill="url(#screen)"/>
    <g fill="#7CD9C9" font-family="Menlo, Consolas, monospace" font-size="13">
      <text x="144" y="328">&gt; scan --cute</text>
      <text x="144" y="348" fill="#FFC2DA">all clear ♥</text>
    </g>
    <circle cx="152" cy="380" r="3" fill="#D9C9EE"/>
    <circle cx="166" cy="380" r="3" fill="#D9C9EE"/>
    <rect x="96" y="388" width="228" height="12" rx="6" fill="#E9DEFA"/>
  </g>

  <!-- paws -->
  <ellipse cx="108" cy="352" rx="17" ry="12" fill="#FFFFFF" stroke="#E3D6F5" stroke-width="3.5"/>
  <ellipse cx="312" cy="352" rx="17" ry="12" fill="#FFFFFF" stroke="#E3D6F5" stroke-width="3.5"/>

  <!-- tail -->
  <path d="M300 350 q46 -10 34 -54" stroke="#E3D6F5" stroke-width="12" fill="none" stroke-linecap="round"/>
  <path d="M300 350 q46 -10 34 -54" stroke="#FFFFFF" stroke-width="7" fill="none" stroke-linecap="round"/>
</svg>
